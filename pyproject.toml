[project]
name = "holt"
version = "0.1.0"
description = "Evidence-backed assessment of whether a GitHub repository is a viable opportunity for an external contributor."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.60",
    "httpx>=0.27",
    "openai>=3.6.0",
]

[project.optional-dependencies]
# The terminal interface only. Deliberately not a hard dependency: the eval
# harness and every reproduction command must keep working after a plain
# `uv sync`, on a machine that has never installed Textual. `holt tui` is the
# only entry point that imports it, and it imports it lazily.
tui = ["textual>=0.80"]

[project.scripts]
holt = "holt.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holt"]

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]
# eval/ lives at the repo root, outside the installed src/holt package.
pythonpath = ["."]
